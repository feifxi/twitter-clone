basePath: /api/v1
definitions:
  api.ConversationResponse:
    properties:
      id:
        type: integer
      lastMessage:
        $ref: '#/definitions/api.MessageResponse'
      peer:
        $ref: '#/definitions/api.UserResponse'
      updatedAt:
        type: string
    type: object
  api.CurrentUserResponse:
    properties:
      avatarUrl:
        type: string
      bannerUrl:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      displayName:
        type: string
      email:
        type: string
      followersCount:
        type: integer
      followingCount:
        type: integer
      id:
        type: integer
      isFollowing:
        type: boolean
      location:
        type: string
      onboarded:
        description: Onboarded is false until the user has chosen their own username.
        type: boolean
      username:
        type: string
      website:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/apperr.FieldError'
        type: array
      message:
        type: string
      requestId:
        type: string
    type: object
  api.HashtagResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      lastUsedAt:
        type: string
      text:
        type: string
      usageCount:
        type: integer
    type: object
  api.HealthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        description: Checks maps each dependency to "ok" or "error"; failure details
          are logged, not exposed.
        type: object
      status:
        type: string
    type: object
  api.MessageResponse:
    properties:
      content:
        type: string
      conversationId:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      sender:
        $ref: '#/definitions/api.UserResponse'
    type: object
  api.NotificationResponse:
    properties:
      actor:
        $ref: '#/definitions/api.UserResponse'
      createdAt:
        type: string
      id:
        type: integer
      isRead:
        type: boolean
      originalTweetContent:
        type: string
      originalTweetId:
        type: integer
      originalTweetMediaUrl:
        type: string
      tweetContent:
        type: string
      tweetId:
        type: integer
      tweetMediaUrl:
        type: string
      type:
        type: string
    type: object
  api.PageResponse-api_ConversationResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/api.ConversationResponse'
        type: array
      nextCursor:
        type: string
    type: object
  api.PageResponse-api_MessageResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/api.MessageResponse'
        type: array
      nextCursor:
        type: string
    type: object
  api.PageResponse-api_NotificationResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/api.NotificationResponse'
        type: array
      nextCursor:
        type: string
    type: object
  api.PageResponse-api_TweetResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/api.TweetResponse'
        type: array
      nextCursor:
        type: string
    type: object
  api.PageResponse-api_UserResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/api.UserResponse'
        type: array
      nextCursor:
        type: string
    type: object
  api.PresignResponse:
    properties:
      objectKey:
        type: string
      presignedUrl:
        type: string
    type: object
  api.SuccessResponse:
    properties:
      success:
        type: boolean
    type: object
  api.TweetResponse:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      isLiked:
        type: boolean
      isRetweeted:
        type: boolean
      likeCount:
        type: integer
      mediaType:
        type: string
      mediaUrl:
        type: string
      replyCount:
        type: integer
      replyToTweetId:
        type: integer
      replyToUsername:
        type: string
      retweetCount:
        type: integer
      retweetedAt:
        type: string
      retweetedBy:
        allOf:
        - $ref: '#/definitions/api.UserResponse'
        description: RetweetedBy is set when the tweet is in a timeline because this
          user retweeted it.
      user:
        $ref: '#/definitions/api.UserResponse'
    type: object
  api.UnreadCountResponse:
    properties:
      count:
        type: integer
    type: object
  api.UserResponse:
    properties:
      avatarUrl:
        type: string
      bannerUrl:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      displayName:
        type: string
      followersCount:
        type: integer
      followingCount:
        type: integer
      id:
        type: integer
      isFollowing:
        type: boolean
      location:
        type: string
      username:
        type: string
      website:
        type: string
    type: object
  api.assistantHistoryItem:
    properties:
      role:
        enum:
        - user
        - model
        - assistant
        type: string
      text:
        type: string
    required:
    - role
    type: object
  api.assistantRequest:
    properties:
      history:
        items:
          $ref: '#/definitions/api.assistantHistoryItem'
        maxItems: 100
        type: array
      query:
        maxLength: 4000
        type: string
    required:
    - query
    type: object
  api.createTweetRequest:
    properties:
      content:
        maxLength: 280
        type: string
      mediaKey:
        maxLength: 200
        type: string
      parentId:
        minimum: 1
        type: integer
    type: object
  api.googleLoginRequest:
    properties:
      idToken:
        type: string
    required:
    - idToken
    type: object
  api.onboardingRequest:
    properties:
      displayName:
        maxLength: 50
        type: string
      username:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - displayName
    - username
    type: object
  api.presignRequest:
    properties:
      contentLength:
        minimum: 1
        type: integer
      contentType:
        type: string
      folder:
        enum:
        - tweets
        - avatars
        - banners
        type: string
    required:
    - contentLength
    - contentType
    - folder
    type: object
  api.sendMessageRequest:
    properties:
      content:
        maxLength: 2000
        type: string
    required:
    - content
    type: object
  api.updateProfileRequest:
    properties:
      avatarKey:
        maxLength: 200
        type: string
      bannerKey:
        maxLength: 200
        type: string
      bio:
        maxLength: 160
        type: string
      displayName:
        maxLength: 50
        type: string
      location:
        maxLength: 30
        type: string
      website:
        maxLength: 100
        type: string
    type: object
  apperr.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: http://github.com/chanombude/twitter-go-api
  description: High-performance Go backend for the Chanom Twitter clone.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Twitter Go API
  version: "1.0"
paths:
  /assistant:
    post:
      consumes:
      - application/json
      description: 'Interact with the Gemini-powered AI assistant. Streams Server-Sent
        Events: each `data:` line is a JSON `{"text": "..."}` chunk; the stream ends
        with `event: done`, or `event: error` with `{"message": "..."}`.'
      parameters:
      - description: Chat query and history
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.assistantRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: AI Assistant Chat (SSE)
      tags:
      - Assistant
  /auth/google:
    post:
      consumes:
      - application/json
      description: Exchange a Google ID token for a session. The access and refresh
        tokens are set as httpOnly cookies.
      parameters:
      - description: Google ID Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.googleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CurrentUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Login with Google
      tags:
      - Auth
  /auth/logout:
    post:
      description: End this browser's session and clear its cookies. Other devices
        stay signed in.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Fetch the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Current User
      tags:
      - Auth
  /auth/refresh:
    post:
      description: 'Rotate the session in the refresh_token cookie: both cookies are
        replaced and the old refresh token stops working.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Refresh Access Token
      tags:
      - Auth
  /discovery/trending:
    get:
      description: Get a list of currently trending hashtags based on recent usage.
      parameters:
      - description: Max number of results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.HashtagResponse'
            type: array
      summary: Trending Hashtags
      tags:
      - Discovery
  /discovery/users:
    get:
      description: Get a paginated list of suggested users to follow.
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_UserResponse'
      summary: Suggested Users
      tags:
      - Discovery
  /events:
    get:
      description: 'One Server-Sent Events stream per signed-in tab. Event names:
        `connected`, `notification` (NotificationResponse), `dm` (MessageResponse).
        Comment lines (`: ping`) are heartbeats. Reconnect on close; the server suggests
        a 3s retry.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Real-time Events (SSE)
      tags:
      - Realtime
  /feeds/following:
    get:
      description: Get a paginated list of tweets from users the current user follows.
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_TweetResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Following Feed
      tags:
      - Feeds
  /feeds/global:
    get:
      description: Get a paginated list of all tweets.
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_TweetResponse'
      summary: Global Feed
      tags:
      - Feeds
  /healthz:
    get:
      description: Reports that the process is up. Never checks dependencies, so a
        database blip doesn't get the container restarted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Liveness Probe
      tags:
      - Monitoring
  /messages/conversations:
    get:
      description: Get a paginated list of the current user's conversations.
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_ConversationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Conversations
      tags:
      - Messages
  /messages/conversations/{id}/messages:
    get:
      description: Get a paginated list of messages in a specific conversation.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Conversation Messages
      tags:
      - Messages
    post:
      consumes:
      - application/json
      description: Send a message to an existing conversation thread.
      parameters:
      - description: Conversation ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Message content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.sendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send Message to Conversation
      tags:
      - Messages
  /messages/users/{id}/messages:
    post:
      consumes:
      - application/json
      description: Start a new conversation or send a message to a user by their ID.
      parameters:
      - description: Recipient User ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Message content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.sendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send Message to User
      tags:
      - Messages
  /notifications:
    get:
      description: Get a paginated list of social notifications (likes, follows, etc.)
        for the current user.
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_NotificationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Notifications
      tags:
      - Notifications
  /notifications/mark-read:
    post:
      description: Clear all unread notification badges for the current user.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark All Read
      tags:
      - Notifications
  /notifications/unread-count:
    get:
      description: Calculate how many unread notifications the current user has.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UnreadCountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Unread Count
      tags:
      - Notifications
  /readyz:
    get:
      description: Checks every dependency (database, and Redis when configured) and
        reports each one.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
        "503":
          description: a dependency is unreachable
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Readiness Probe
      tags:
      - Monitoring
  /search/hashtags:
    get:
      description: Find trending or specific hashtags matching a prefix.
      parameters:
      - description: Hashtag prefix
        in: query
        name: q
        required: true
        type: string
      - description: Max number of results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.HashtagResponse'
            type: array
      summary: Search Hashtags
      tags:
      - Search
  /search/tweets:
    get:
      description: Search for tweets by content (using full-text search) with pagination.
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_TweetResponse'
      summary: Search Tweets
      tags:
      - Search
  /search/users:
    get:
      description: Search for users by username or display name with pagination.
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_UserResponse'
      summary: Search Users
      tags:
      - Search
  /tweets:
    post:
      consumes:
      - application/json
      description: Post a new tweet with optional text and media.
      parameters:
      - description: Tweet content and media
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createTweetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.TweetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Tweet
      tags:
      - Tweets
  /tweets/{id}:
    delete:
      description: Remove a tweet by ID. Only the author can delete their own tweet.
      parameters:
      - description: Tweet ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Tweet
      tags:
      - Tweets
    get:
      description: Fetch a single tweet by its ID.
      parameters:
      - description: Tweet ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TweetResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get Tweet
      tags:
      - Tweets
  /tweets/{id}/like:
    delete:
      description: Remove a like from a tweet.
      parameters:
      - description: Tweet ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unlike Tweet
      tags:
      - Tweets
    post:
      description: Add a like to a tweet.
      parameters:
      - description: Tweet ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Like Tweet
      tags:
      - Tweets
  /tweets/{id}/replies:
    get:
      description: Get a paginated list of replies to a specific tweet.
      parameters:
      - description: Tweet ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Number of items per page
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PageResponse-api_TweetResponse'
      summary: Get Tweet Replies
      tags:
      - Tweets
  /tweets/{id}/retweet:
    delete:
      description: Remove a previously shared retweet.
      parameters:
      - description: Original Tweet ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Undo Retweet
      tags:
      - Tweets
    post:
      description: Share a tweet on your own profile.
      parameters:
      - description: Tweet ID to retweet
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
