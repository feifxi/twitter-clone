name: Deploy

on:
  # Deploy only what CI has verified: runs when CI finishes on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy existing images (commit SHA), e.g. to roll back. Empty = build this commit."
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a deploy halfway

permissions:
  contents: read
  id-token: write # GitHub OIDC → short-lived AWS credentials (no stored keys)

# Repository variables (Settings → Secrets and variables → Actions → Variables), all
# printed by `terraform output` except GOOGLE_CLIENT_ID: AWS_REGION, AWS_DEPLOY_ROLE_ARN,
# ECR_API_REPOSITORY, ECR_WEB_REPOSITORY, EC2_INSTANCE_ID, SITE_DOMAIN, GOOGLE_CLIENT_ID.
#
# Both images are tagged with the commit SHA and deployed together, so the web app and
# the API always match. AWS trusts this repository's main branch only (see github.tf).
env:
  # The commit CI tested (workflow_run), or the one a manual run started from.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.image_tag) }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: api
            context: twitter-go-api
            repository: ECR_API_REPOSITORY
          - image: web
            context: twitter-next-web
            repository: ECR_WEB_REPOSITORY
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ vars[matrix.repository] }}:${{ env.SHA }}
          # Only the web image uses it (baked into the browser bundle; not a secret).
          build-args: NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    # Runs after a successful build, or straight away for a rollback (build skipped).
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on EC2 (SSM Run Command)
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters "commands=[\"/opt/twitter/deploy.sh ${IMAGE_TAG}\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{status: Status, stdout: StandardOutputContent, stderr: StandardErrorContent}' --output yaml
          test "$status" = Success

      - name: Check the site is up
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "https://${{ vars.SITE_DOMAIN }}/readyz" && curl -fsS -o /dev/null "https://${{ vars.SITE_DOMAIN }}/" && exit 0
            sleep 5
          done
          echo "The site did not become ready" >&2
          exit 1
