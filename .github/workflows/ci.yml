name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-api:
    name: Go API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: twitter-go-api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: twitter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d twitter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/twitter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: twitter-go-api/go.mod
          cache-dependency-path: twitter-go-api/go.sum
      - name: Check sqlc output is up to date
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - run: sqlc diff
      - name: Check generated test fakes are up to date
        run: go generate ./internal/db/... && git diff --exit-code
      - run: go vet ./...
      - name: Unit + integration tests (against the Postgres service)
        run: go test -race -count=1 ./...

  web:
    name: Next.js web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: twitter-next-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: twitter-next-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"
      - run: terraform fmt -check -recursive
      - name: Validate and plan against a mocked AWS provider
        run: |
          for dir in bootstrap terraform; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
          terraform -chdir=terraform test
