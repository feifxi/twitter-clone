name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-api:
    name: Go API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: twitter-go-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: twitter-go-api/go.mod
          cache-dependency-path: twitter-go-api/go.sum
      - name: Check sqlc output is up to date
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - run: sqlc diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    name: Next.js web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: twitter-next-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: twitter-next-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
