name: Deploy Go API

on:
  push:
    branches: [main]
    paths:
      - "twitter-go-api/**"
      - ".github/workflows/deploy-go-api.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing image (commit SHA), e.g. to roll back. Empty = build this commit."
        required: false

concurrency:
  group: deploy-go-api
  cancel-in-progress: false # never interrupt a deploy halfway

permissions:
  contents: read
  id-token: write # GitHub OIDC → short-lived AWS credentials (no stored keys)

# Repository variables (Settings → Secrets and variables → Actions → Variables),
# all printed by `terraform output`: AWS_REGION, AWS_DEPLOY_ROLE_ARN,
# ECR_REPOSITORY, EC2_INSTANCE_ID, API_DOMAIN.
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: ${{ !inputs.image_tag }}
        with:
          # Latest 1.26 patch (go.mod's "go 1.26.0" is a minimum, not the toolchain to test with).
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: twitter-go-api/go.sum

      - name: Unit tests
        if: ${{ !inputs.image_tag }}
        working-directory: twitter-go-api
        run: go test ./...

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.image_tag }}

      - name: Build and push image
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: twitter-go-api
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 (SSM Run Command)
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters "commands=[\"/opt/twitter/deploy.sh ${IMAGE_TAG}\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{status: Status, stdout: StandardOutputContent, stderr: StandardErrorContent}' --output yaml
          test "$status" = Success

      - name: Check the API is ready
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "https://${{ vars.API_DOMAIN }}/readyz" && exit 0
            sleep 5
          done
          echo "API did not become ready" >&2
          exit 1
