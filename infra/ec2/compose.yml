# Production stack on the EC2 instance: one domain, Caddy in front of the web app and the API.
# Rendered values come from deploy.sh: API_IMAGE, WEB_IMAGE, SITE_DOMAIN, ACME_EMAIL
# (environment) and api.env / monitoring.env (from SSM).
#
# Single instance, so no Redis: rate limits and live updates work in memory. To run several
# instances behind a load balancer, add a shared Redis (e.g. ElastiCache) and set REDIS_URL.
name: twitter

services:
  # TLS termination (Let's Encrypt) and the only container with published ports.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep across restarts to avoid Let's Encrypt rate limits
      - caddy_config:/config
    depends_on: [web, api]

  # Next.js (server rendering). It calls the API inside this network, not through Caddy.
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080/api/v1
      HOSTNAME: 0.0.0.0
    depends_on: [api]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: api.env
    logging: *logging

  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.10.2
    restart: unless-stopped
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/rootfs"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  alloy:
    profiles: [monitoring]
    image: grafana/alloy:v1.14.0
    restart: unless-stopped
    env_file: monitoring.env
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [api]

volumes:
  caddy_data:
  caddy_config:
