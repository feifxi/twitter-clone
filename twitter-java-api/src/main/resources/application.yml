# Settings come from the same environment variables as twitter-go-api (see app.env.example),
# so one app.env works for either backend. DATABASE_URL, HTTP_SERVER_ADDRESS, REDIS_URL and
# LOG_LEVEL are translated into Spring properties by GoStyleEnvironment.
spring:
  application:
    name: twitter-java-api
  config:
    import: optional:file:./app.env[.properties]
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # V1 is byte-identical to the Go API's migration (CI checks this), so on a database the
    # Go API already migrated, Flyway adopts the existing schema as V1 instead of failing.
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      repositories:
        enabled: false
  ai:
    # Gemini through Spring AI. Without GEMINI_API_KEY, GoStyleEnvironment switches the
    # models off (spring.ai.model.*=none) and the assistant reports itself unavailable.
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2-preview}
              dimensions: 768
  mvc:
    problemdetails:
      enabled: false
  jackson:
    default-property-inclusion: always

server:
  # Behind Caddy: trust X-Forwarded-For from private addresses only (client IPs for rate limits).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics

springdoc:
  swagger-ui:
    path: /swagger/index.html
  api-docs:
    path: /swagger/doc.json

app:
  environment: ${ENVIRONMENT:development}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  cookie-domain: ${COOKIE_DOMAIN:}
  token-symmetric-key: ${TOKEN_SYMMETRIC_KEY:}
  access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:720h}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  s3-bucket: ${S3_BUCKET_NAME:}
  s3-region: ${S3_REGION:ap-southeast-1}
  cloudfront-domain: ${CLOUDFRONT_DOMAIN:}
  max-media-bytes: ${MAX_MEDIA_BYTES:104857600}
  max-avatar-bytes: ${MAX_AVATAR_BYTES:5242880}
  max-banner-bytes: ${MAX_BANNER_BYTES:10485760}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
  gemini-embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2-preview}
  enable-rag: ${ENABLE_RAG:true}
  # Tests turn this off; RateLimitIntegrationTest turns it back on.
  rate-limits-enabled: ${RATE_LIMITS_ENABLED:true}
